plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.paperbuild.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.paperbuild.app'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        // Key for direct (sideload) installs only, so each new APK installs over the old one.
        // For the Play Store, create a private upload key and keep it out of this repo.
        sideload {
            storeFile file('../sideload.keystore')
            storePassword 'android'
            keyAlias 'paperbuild'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
