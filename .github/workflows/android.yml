name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html app.html signup.html privacy.html manifest.webmanifest assets fonts vendor android/app/src/main/assets/www/

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PaperBuild.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PaperBuild-apk
          path: PaperBuild.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Paper Build for Android (build ${{ github.run_number }})
          body: |
            Download **PaperBuild.apk** below on your Android phone, open it, and allow "Install unknown apps" for your browser if asked.
            New builds install over the old one and keep your drafts.
          files: PaperBuild.apk
          make_latest: true
